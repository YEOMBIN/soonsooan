<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 930" preserveAspectRatio="xMidYMid slice">
  <!-- 오시는 길 배경 (Figma 287:2980 재현): 흰 바탕 + 우측 상단에서 흘러내리는 실크 곡선 + 좌측 하단 블루 확산 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset=".55" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <radialGradient id="lb" cx=".08" cy="1.02" r=".55">
      <stop offset="0" stop-color="#d4e9f6" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#e3f1fa" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="mid" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="fine" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1920" height="930" fill="url(#bg)"/>
  <rect width="1920" height="930" fill="url(#lb)"/>

  <!-- 우측 상단 실크 띠: 넓고 흐린 스카이블루 그림자 -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M980 70 C 1300 -40, 1680 60, 2010 330" stroke="#cfe3f1" stroke-width="120" stroke-opacity=".55"/>
    <path d="M1060 230 C 1380 110, 1720 240, 2010 560" stroke="#d6e8f4" stroke-width="150" stroke-opacity=".5"/>
    <path d="M1180 420 C 1460 330, 1760 470, 2010 800" stroke="#dbeaf5" stroke-width="130" stroke-opacity=".45"/>
  </g>
  <!-- 띠 사이 밝은 광택 -->
  <g fill="none" stroke-linecap="round" filter="url(#mid)">
    <path d="M940 150 C 1270 20, 1660 130, 2000 430" stroke="#ffffff" stroke-width="34" stroke-opacity=".95"/>
    <path d="M1040 330 C 1360 200, 1700 330, 2000 660" stroke="#ffffff" stroke-width="28" stroke-opacity=".9"/>
    <path d="M1200 520 C 1470 430, 1760 560, 2000 870" stroke="#ffffff" stroke-width="22" stroke-opacity=".8"/>
  </g>
  <!-- 가는 곡선 결 -->
  <g fill="none" stroke-linecap="round" filter="url(#fine)">
    <path d="M900 110 C 1250 -10, 1650 90, 2000 380" stroke="#bcd8ec" stroke-width="3" stroke-opacity=".7"/>
    <path d="M1000 270 C 1330 150, 1690 280, 2000 610" stroke="#c4ddef" stroke-width="2.5" stroke-opacity=".65"/>
    <path d="M1120 470 C 1420 370, 1740 500, 2000 830" stroke="#c9e0f0" stroke-width="2.2" stroke-opacity=".6"/>
    <path d="M1300 640 C 1540 570, 1800 690, 1990 930" stroke="#cfe3f2" stroke-width="2" stroke-opacity=".55"/>
  </g>

  <!-- 좌측 하단으로 퍼지는 곡선 -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M-80 620 C 160 700, 360 820, 520 990" stroke="#d3e7f5" stroke-width="140" stroke-opacity=".5"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#mid)">
    <path d="M-60 560 C 200 640, 420 780, 600 980" stroke="#ffffff" stroke-width="26" stroke-opacity=".85"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#fine)">
    <path d="M-60 690 C 170 760, 340 860, 470 990" stroke="#c6def0" stroke-width="2.4" stroke-opacity=".6"/>
    <path d="M-60 520 C 220 600, 460 760, 660 980" stroke="#cfe4f3" stroke-width="2" stroke-opacity=".5"/>
  </g>
</svg>
